<!DOCTYPE html>
<!--
  Pincushion quickstart demo page (intentionally flawed).
  This file is the PRISTINE TEMPLATE. start_quickstart_demo copies it to
  <project>/.feedback/.quickstart/landing.html and the agent fixes the COPY —
  this template is never edited. Three deliberate flaws map to the demo pins:
    #cta-primary  -> "Sumbit" typo + low contrast (#bbb on white)
    .hero-title   -> "Welcom" misspelling
    .nav-link     -> 9px, too small to read
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acme — demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #111; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 32px; border-bottom: 1px solid #eee; }
    .nav-link { font-size: 9px; margin-left: 16px; color: #333; text-decoration: none; }
    .hero { padding: 80px 32px; text-align: center; }
    .hero-title { font-size: 44px; margin: 0 0 12px; }
    .hero-sub { font-size: 18px; color: #555; }
    #cta-primary { margin-top: 24px; padding: 12px 28px; font-size: 16px; border: 0; border-radius: 8px; background: #f3f3f3; color: #bbb; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <strong>Acme</strong>
    <nav>
      <a class="nav-link" href="#">Features</a>
      <a class="nav-link" href="#">Pricing</a>
      <a class="nav-link" href="#">Docs</a>
    </nav>
  </header>
  <section class="hero">
    <h1 class="hero-title">Welcom to Acme</h1>
    <p class="hero-sub">The fastest way to ship your product.</p>
    <button id="cta-primary">Sumbit</button>
  </section>
</body>
</html>
